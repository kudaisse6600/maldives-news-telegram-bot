services:
  - type: worker
    name: maldives-news-telegram-bot
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: POLL_INTERVAL_MS
        value: "300000"
      - key: MAX_POSTS_PER_FEED_PER_CHECK
        value: "5"
      - key: DEDUPE_FILE
        value: /var/data/seen.json
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        sync: false
      - key: RSS_FEEDS
        value: https://tnn.mv/en/rss/latest-posts,https://tnn.mv/en/rss/category/local-news
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: MAX_AGE_DAYS
        value: "3"
